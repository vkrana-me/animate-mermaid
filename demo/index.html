<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>animate-mermaid demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f8; color: #1b1b1f; }
    main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; min-height: 100vh; box-sizing: border-box; }
    aside { display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 260px; font: 13px/1.4 ui-monospace, monospace; box-sizing: border-box; }
    label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    button { padding: 6px 10px; cursor: pointer; }
    #stage { background: white; border-radius: 8px; padding: 16px; display: flex; align-items: center; justify-content: center; overflow: auto; }
    #stage svg { max-width: 100%; height: auto; }
    #err { color: #b00020; font-size: 13px; white-space: pre-wrap; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <aside>
      <select id="sample"></select>
      <textarea id="src" spellcheck="false"></textarea>
      <label>Order <select id="order"><option>flow</option><option>position</option><option>together</option></select></label>
      <label>Node effect <select id="nodeEffect"><option>pop</option><option>fade</option><option>slide</option><option>none</option></select></label>
      <label>Edge effect <select id="edgeEffect"><option>draw</option><option>fade</option><option>none</option></select></label>
      <label>Node ms <input id="nodeDuration" type="number" value="450" step="50" /></label>
      <label>Edge ms <input id="edgeDuration" type="number" value="500" step="50" /></label>
      <label>Loop <input id="loop" type="checkbox" /></label>
      <div class="row">
        <button id="play">Play</button><button id="pause">Pause</button><button id="restart">Restart</button>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <div class="row">
        <button id="svg">Export animated SVG</button><button id="png">Export PNG</button><button id="gif">Export GIF</button>
      </div>
      <div id="err"></div>
    </aside>
    <section id="stage"></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
